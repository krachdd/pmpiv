name: Tests

on:
  push:
    branches: [main, v100]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        env:
          # Mirrors addpythonpath.sh: pmpiv package + bundled pims + bundled trackpy
          PYTHONPATH: >-
            ${{ github.workspace }}/pmpiv/pmpiv:${{ github.workspace }}/pmpiv/pims:${{ github.workspace }}/pmpiv/trackpy
          # Non-interactive matplotlib backend (no display required)
          MPLBACKEND: Agg
        working-directory: pmpiv/pmpiv
        run: pytest tests/ -v --tb=short
